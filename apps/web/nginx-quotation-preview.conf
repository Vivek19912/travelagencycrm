# Server-side Open Graph previews for public quotation links.
#
# WHY THIS EXISTS
# Social unfurlers (WhatsApp, Facebook, Telegram, ...) read only the initial
# HTML response and never execute JavaScript, so the SPA shell gives them the
# generic platform branding from index.html. When such a crawler requests a
# quotation path, this block rewrites the request internally to the API
# preview endpoint, which returns tenant-branded metadata (the owning
# company's name and logo) as a standalone HTML document. Browsers are
# unaffected: they fall through to the SPA shell below.
#
# SEARCH-ENGINE CLARIFICATION
# Only social unfurlers are matched. Googlebot/Bingbot render JavaScript and
# are deliberately NOT matched, so they keep seeing exactly what users see.
# There is no cloaking concern.
#
# PLACEMENT
# Include ONCE per server block that serves quotation links (port 443 content
# blocks for yourquotation.in, app.travelagencycrm.in and the ACTIVE custom
# quotation domains). Place the include AFTER the
# `location ~* \.[a-z0-9]+$` extension guard (paths with extensions must 404,
# never reach the app). Order relative to `location /` does not matter:
# regex locations always beat the plain prefix, while exact matches
# (`= /healthz`, `= /api`) and `^~ /api/` still take precedence.
# Do NOT add this to redirect-only blocks (www -> apex) or the test host.
#
# EXAMPLE (inside server { ... }):
#   include /etc/nginx/snippets/quotation-preview-crawler.conf;
#
location ~ ^/(q/[^/]+|[^/.]+)/?$ {
    if ($http_user_agent ~* "whatsapp|facebookexternalhit|facebot|twitterbot|linkedinbot|telegrambot|slackbot|discordbot|pinterest|applebot") {
        rewrite ^/q/([^/]+)/?$ /api/public/quotations/$1/preview last;
        rewrite ^/([^/.]+)/?$ /api/public/quotations/by-slug/$1/preview last;
    }
    try_files $uri $uri/ /index.html;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Vary "User-Agent" always;
}
